<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ချစ်လား မချစ်ဘူးလား 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 22px; overflow: hidden;
      font-family: system-ui, "Noto Sans Myanmar", sans-serif;
      background: radial-gradient(circle at 20% 15%, #ffe1ed, transparent 35%),
                  radial-gradient(circle at 85% 80%, #e7ddff, transparent 38%),
                  linear-gradient(135deg, #fff4f7, #f5efff);
      color: #5b2942;
    }
    .card {
      width: min(100%, 480px); padding: 38px 24px 34px; text-align: center;
      border: 1px solid rgba(255,255,255,.9); border-radius: 30px;
      background: rgba(255,255,255,.78); backdrop-filter: blur(12px);
      box-shadow: 0 18px 55px rgba(155, 79, 121, .16);
      position: relative; z-index: 1;
    }
    .heart { font-size: 62px; animation: beat 1.2s infinite; }
    @keyframes beat { 50% { transform: scale(1.13); } }
    h1 { font-size: clamp(25px, 6vw, 34px); margin: 14px 0 10px; }
    p { color: #91627a; font-size: 16px; line-height: 1.8; margin: 0 0 26px; }
    .buttons { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 58px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 27px; min-width: 125px;
      font: 700 16px system-ui, "Noto Sans Myanmar", sans-serif;
      cursor: pointer; transition: transform .18s, box-shadow .18s;
      touch-action: manipulation;
    }
    button:active { transform: scale(.96); }
    #yes { background: linear-gradient(135deg, #ff5c99, #ff82b2); color: white; box-shadow: 0 8px 20px #ff8bb755; }
    #no { background: #f1eaf0; color: #805c73; }
    #message { min-height: 34px; margin-top: 24px; color: #e34d89; font-weight: 700; font-size: 18px; }
    .hint { margin-top: 10px; font-size: 12px; color: #b18da2; }
    .float-heart { position: fixed; bottom: -30px; pointer-events: none; animation: rise 5s linear forwards; opacity: .7; }
    @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
    #no.running { position: fixed; z-index: 5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>ကိုယ့်ကို ချစ်လားဟင်? 🥺</h1>
    <p>အမှန်အတိုင်း ဖြေပေးနော်…<br>ကိုယ် စောင့်နေမယ် 💕</p>
    <div class="buttons">
      <button id="yes">ချစ်တယ် ❤️</button>
      <button id="no">မချစ်ဘူး 🙈</button>
    </div>
    <div id="message" aria-live="polite"></div>
    <div class="hint">မချစ်ဘူးကို နှိပ်ကြည့်လေ… 🤭</div>
  </main>
  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const message = document.getElementById('message');
    let attempts = 0;

    function moveNo() {
      attempts++;
      noBtn.classList.add('running');
      const pad = 16;
      const maxX = Math.max(pad, window.innerWidth - noBtn.offsetWidth - pad);
      const maxY = Math.max(pad, window.innerHeight - noBtn.offsetHeight - pad);
      noBtn.style.left = (pad + Math.random() * (maxX - pad)) + 'px';
      noBtn.style.top = (pad + Math.random() * (maxY - pad)) + 'px';
      message.textContent = ['ဟာ… မဖမ်းမိဘူးနော် 😝', 'မချစ်ဘူးလို့ မပြောပါနဲ့ဦး 🥹', 'ဒီခလုတ်လေးက ပြေးတတ်တယ် 🤣'][attempts % 3];
    }

    noBtn.addEventListener('pointerenter', moveNo);
    noBtn.addEventListener('click', moveNo);
    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      moveNo();
    }, { passive: false });

    yesBtn.addEventListener('click', () => {
      message.textContent = 'ဝမ်းသာလိုက်တာ… ကိုယ်လည်း ချစ်တယ်နော် 💖';
      yesBtn.textContent = 'အရမ်းချစ်တယ် 💞';
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('span');
        heart.className = 'float-heart';
        heart.textContent = ['💗','💕','💖','❤️'][i % 4];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (18 + Math.random() * 22) + 'px';
        heart.style.animationDuration = (3 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6500);
      }
    });
  </script>
</body>
</html>
